<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmon</title>
<style>
  /* Colours come from the active cmon theme (config.json "theme"); these are only
     the fallback until the first snapshot arrives. */
  :root {
    --bg: #1d1f21; --fg: #e8e8e3; --dim: #8a8a80; --accent: #fd971f; --border: #3a3b35;
    --running: #66d9ef; --thinking: #ae81ff; --done: #a6e22e; --asking: #e6db74;
    --interrupted: #f92672; --idle: #75715e;
    --surface: color-mix(in srgb, var(--fg) 4%, var(--bg));
    --surface-2: color-mix(in srgb, var(--fg) 8%, var(--bg));
    --line: color-mix(in srgb, var(--border) 80%, var(--bg));
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
  body { padding: 0 20px 32px; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* header ------------------------------------------------------------------ */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 0 12px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font: 700 18px/1 var(--mono); color: var(--accent); letter-spacing: -.5px; }
  .brand span { color: var(--dim); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
  }
  .stat .v { font: 600 13px var(--mono); }
  .stat .k { color: var(--dim); }
  .stat.hot { border-color: color-mix(in srgb, var(--asking) 60%, var(--line)); }
  .stat.hot .v { color: var(--asking); }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
  .conn.off i { background: var(--interrupted); animation: blink 1s infinite; }
  .clock { font: 12px var(--mono); color: var(--dim); }

  /* layout ------------------------------------------------------------------ */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; margin-top: 18px; }
  main.tl-folded { grid-template-columns: minmax(0, 1fr) auto; }
  @media (max-width: 1100px) { main, main.tl-folded { grid-template-columns: 1fr; } }
  .lane { margin-bottom: 26px; }
  .lane h2 {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 600 11px/1 var(--sans);
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  }
  .lane h2 .n { font-family: var(--mono); color: var(--fg); opacity: .7; }
  .lane h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  /* any lane folds to its heading; the fold is remembered in this browser */
  .fold { display: inline-flex; align-items: center; gap: 8px; margin: 0; font: inherit; letter-spacing: inherit;
    text-transform: inherit; color: inherit; }
  .lane h2 .fold:hover { color: var(--fg); }
  .fold::before { content: "▾"; font-size: 10px; width: 10px; transition: transform .15s; }
  .folded .fold::before { transform: rotate(-90deg); }
  .lane.folded > :not(h2) { display: none; }
  .lane.folded { margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } body { padding: 0 12px 24px; } }
  .empty { color: var(--dim); padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }

  /* card -------------------------------------------------------------------- */
  .card {
    --st: var(--idle);
    position: relative; overflow: hidden; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--line); transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--st) 45%, var(--line)); }
  .card::before {   /* the project colour, same as the TUI's focus tag */
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--focus, var(--line));
  }
  .card.asking { border-color: color-mix(in srgb, var(--asking) 55%, var(--line));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--asking) 18%, transparent), 0 6px 24px -12px var(--asking); }
  .card.interrupted { border-color: color-mix(in srgb, var(--interrupted) 45%, var(--line)); }
  .card.done, .card.idle { background: color-mix(in srgb, var(--fg) 2.5%, var(--bg)); }
  .head { display: block; width: 100%; text-align: left; padding: 12px 14px 12px 17px; }
  .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 7px; border-radius: 999px;
    font: 600 11px/18px var(--sans); color: var(--st); background: color-mix(in srgb, var(--st) 13%, transparent);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st); flex: none; }
  .running .dot, .thinking .dot { animation: pulse 1.4s ease-in-out infinite; }
  .asking .dot { animation: ring 1.6s ease-out infinite; }
  .focus { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; min-width: 0; }
  .focus i { width: 6px; height: 6px; border-radius: 2px; background: var(--focus); flex: none; }
  .row1 .age { margin-left: auto; color: var(--dim); font: 12px var(--mono); white-space: nowrap; }
  .title {
    font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0 0 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .doing { color: var(--dim); font-size: 12px; margin: -2px 0 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doing b { color: var(--fg); font-weight: 500; }
  .asked { color: var(--dim); font-size: 12px; margin: -3px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asked q { color: color-mix(in srgb, var(--fg) 78%, var(--bg)); quotes: "“" "”"; }
  .said {
    margin: 0 0 10px; padding: 1px 0 1px 9px; border-left: 2px solid color-mix(in srgb, var(--st) 55%, var(--line));
    font-size: 12.5px; color: color-mix(in srgb, var(--fg) 82%, var(--bg));
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .said.one { -webkit-line-clamp: 1; }
  .open .said { -webkit-line-clamp: unset; }
  .pill.bg { color: var(--running); background: color-mix(in srgb, var(--running) 12%, transparent); font-weight: 500; }
  .pill.bg .dot { background: var(--running); animation: pulse 1.4s ease-in-out infinite; }
  .live { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; grid-column: 1 / -1; }
  .live li { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
  .live .dot { animation: pulse 1.4s ease-in-out infinite; }
  .live .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live .rt { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
  .live .more { display: block; color: var(--dim); font-size: 11.5px; padding-left: 15px; }
  .wf .live { margin-top: 4px; }
  .quiet { display: grid; gap: 4px; }
  .quiet .cl { padding: 7px 12px; cursor: pointer; }
  .quiet .cl:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
  .quiet .cost { font: 600 12px var(--mono); }
  .lane h2 button { margin-left: 4px; font: 600 11px var(--sans); color: var(--accent); letter-spacing: 0; text-transform: none; }
  .card.done .title, .card.idle .title { color: color-mix(in srgb, var(--fg) 88%, var(--bg)); }
  .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .meta .cost { margin-left: auto; color: var(--fg); font: 600 12px var(--mono); }
  .ctx { display: flex; align-items: center; gap: 7px; }
  .bar { position: relative; width: 64px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--c, var(--done)); }
  .bar.wide { width: 100%; }

  /* workflows + plan, always visible ---------------------------------------- */
  .work { padding: 0 14px 12px 17px; display: grid; gap: 8px; }
  .wf {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px;
    padding: 8px 10px; border-radius: 8px; background: var(--surface-2);
  }
  .wf .ic { font: 600 10px var(--mono); color: var(--thinking); border: 1px solid color-mix(in srgb, var(--thinking) 50%, transparent);
    border-radius: 4px; padding: 0 4px; }
  .wf .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf .nm small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .wf .rt { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
  .wf .bar { grid-column: 1 / -1; }
  .wf.done .ic { color: var(--done); border-color: color-mix(in srgb, var(--done) 50%, transparent); }
  .plan { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
  .plan .bar { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .chip.on { color: var(--running); border-color: color-mix(in srgb, var(--running) 45%, var(--line)); }

  /* detail (click a card) --------------------------------------------------- */
  .detail { display: none; border-top: 1px solid var(--line); padding: 12px 14px 14px 17px; gap: 14px; }
  .open .detail { display: grid; }
  .detail h4 { margin: 0 0 6px; font: 600 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .tasks, .agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .tasks li, .agents li { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
  .tasks .box { font-family: var(--mono); width: 16px; flex: none; color: var(--dim); }
  .tasks .completed { color: var(--dim); }
  .tasks .completed .box { color: var(--done); }
  .tasks .completed span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--dim) 60%, transparent); }
  .tasks .in_progress { color: var(--fg); font-weight: 600; }
  .tasks .in_progress .box { color: var(--running); }
  .tasks .blocked { font-size: 11px; color: var(--dim); font-weight: 400; }
  .agents li .dot { align-self: center; }
  .agents li .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agents li .rt { color: var(--dim); font: 11.5px var(--mono); white-space: nowrap; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px; }
  .facts dt { color: var(--dim); }
  .facts dd { margin: 0; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy { color: var(--accent); border-bottom: 1px dotted; }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .feed li { display: grid; grid-template-columns: 44px auto 1fr; gap: 8px; align-items: baseline; font-size: 12px; }
  .feed .t { font: 11px var(--mono); color: var(--dim); }
  .feed .tool { font: 600 11px var(--mono); color: var(--accent); white-space: nowrap; }
  .feed .d { color: color-mix(in srgb, var(--fg) 80%, var(--bg)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt { font-size: 12.5px; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); }
  .card { --focus: var(--focus-d); }
  :root.light .card { --focus: var(--focus-l); }

  /* theme picker ------------------------------------------------------------ */
  .theme { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  .theme select {
    font: 12px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; cursor: pointer;
  }
  .swatch { display: inline-flex; gap: 2px; }
  .swatch i { width: 8px; height: 8px; border-radius: 2px; }

  /* closed sessions --------------------------------------------------------- */
  .closed { display: grid; gap: 6px; }
  .cl {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--fg) 2%, var(--bg));
  }
  .cl .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl .tt small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 11.5px; }
  .cl .sub { grid-column: 1; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl .act { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 12px; }
  .cl .when { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
  .btn {
    font: 600 11.5px var(--sans); padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--accent);
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .hint { color: var(--dim); font-size: 12px; margin: -4px 0 10px; }
  .loading { color: var(--dim); padding: 40px 0; text-align: center; }

  /* timeline ---------------------------------------------------------------- */
  aside { position: sticky; top: 74px; align-self: start; max-height: calc(100vh - 92px); display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  @media (max-width: 1100px) { aside { position: static; max-height: none; } }
  aside header { position: static; padding: 12px 14px 10px; background: none; gap: 10px; }
  aside header h3 { margin: 0; font-size: 13px; }
  aside header h3 .n { font: 400 12px var(--mono); color: var(--dim); }
  aside.folded header { padding-bottom: 12px; }
  aside.folded header .chips, aside.folded .tl { display: none; }
  aside header h3 .n:empty, aside:not(.folded) header h3 .n { display: none; }
  aside header .chips { margin-left: auto; }
  aside .chip { cursor: pointer; }
  aside .chip.sel { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .tl { overflow: auto; padding: 4px 14px 14px; }
  .hour { font: 600 10.5px var(--mono); color: var(--dim); margin: 12px 0 4px; }
  .ev { position: relative; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .ev:first-of-type { border-top: 0; }
  .ev .g { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 10px var(--mono);
    color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
  .ev .what { font-size: 12.5px; min-width: 0; }
  .ev .what b { font-weight: 600; }
  .ev .what .sub { display: block; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .when { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }
  .ev.fresh { animation: arrive .6s ease-out; }

  footer { margin-top: 6px; color: var(--dim); font-size: 12px; }

  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--asking) 70%, transparent); }
    100% { box-shadow: 0 0 0 7px transparent; } }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes arrive { from { background: color-mix(in srgb, var(--accent) 18%, transparent); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>cmon</b><span>claude monitor</span></div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <label class="theme"><span class="swatch" id="swatch"></span><select id="theme" title="theme (this page only)"></select></label>
  <div class="conn" id="conn"><i></i><span>live</span></div>
  <div class="clock num" id="clock"></div>
</header>
<main>
  <section id="board"><div class="loading">Reading transcripts… the first pass takes a few seconds.</div></section>
  <aside>
    <header>
      <h3><button class="fold" data-fold="today">Today <span class="n" id="today-n"></span></button></h3>
      <div class="chips" id="filters"></div>
    </header>
    <div class="tl" id="timeline"></div>
  </aside>
</main>

<script>
'use strict';
// Read-only page: everything below renders the snapshot cmon sends over /events.
// No network beyond 127.0.0.1, no storage beyond which cards you opened, which
// lanes you folded and the page's theme.

const STATUS = {
  asking: 'Needs you', interrupted: 'Stopped', running: 'Running', thinking: 'Thinking', done: 'Done', idle: 'Idle',
};
const LANES = [
  { key: 'you', title: 'Waiting on you', has: ['asking', 'interrupted'], none: '' },
  { key: 'work', title: 'Working', has: ['running', 'thinking'], none: 'Nothing is running.' },
  { key: 'rest', title: 'Finished · idle', has: ['done', 'idle'], none: '' },
];
const EV = {
  session: { g: 'S', label: 'Session' }, workflow: { g: 'W', label: 'Workflow' },
  task: { g: '✓', label: 'Task' }, agent: { g: 'A', label: 'Agent' },
};

let state = null;
let pending = null;
let filter = 'all';
const seenEvents = new Set();
const open = new Set(JSON.parse(sessionStorage.getItem('cmon.open') || '[]'));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function ago(ms) {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 45) return 'now';
  const m = Math.round(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60}m` : Math.floor(h / 24) + 'd';
}
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dur = (ms) => { const m = Math.round(ms / 60000); return m < 60 ? m + 'm' : `${Math.floor(m / 60)}h ${m % 60}m`; };
function money(v) {
  if (v == null) return '';
  return v >= 100 ? '$' + Math.round(v).toLocaleString('en-US') : '$' + v.toFixed(2);
}
function tokens(n) {
  if (!n) return '0';
  return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.0', '') + 'M' : Math.round(n / 1e3) + 'k';
}
// Context fill on the theme's own green -> amber -> red.
const ctxColour = (r) => (r < 0.6 ? 'var(--done)' : r < 0.85 ? 'var(--asking)' : 'var(--interrupted)');
// Live dots keep their phase across re-renders instead of restarting every refresh.
const phase = (period) => `animation-delay:-${Date.now() % period}ms`;

// The page's own theme choice lives in localStorage; '' follows config.json.
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { /* private mode */ } },
};
let picked = store.get('cmon.theme');

// Folded lanes, by key. localStorage rather than sessionStorage: a lane you never
// want to see (closed sessions, say) should stay folded across restarts.
const folded = new Set(store.get('cmon.folded').split(',').filter(Boolean));
// A lane's heading, as a button that folds it to that one line.
function laneHead(key, title, n) {
  return `<h2><button class="fold" data-fold="${key}" aria-expanded="${!folded.has(key)}">${title} <span class="n">${n}</span></button></h2>`;
}
const laneClass = (key) => `lane${folded.has(key) ? ' folded' : ''}`;
// The Today panel folds the same way; folded, it shrinks to its heading and the
// board takes the full width.
function applyTodayFold() {
  const on = folded.has('today');
  document.querySelector('aside').classList.toggle('folded', on);
  document.querySelector('main').classList.toggle('tl-folded', on);
  document.querySelector('[data-fold="today"]').setAttribute('aria-expanded', String(!on));
}
applyTodayFold();

function currentTheme() {
  const list = state.themes || [];
  return (picked && list.find((t) => t.name === picked)) || state.theme;
}

function applyTheme(t) {
  if (!t || !t.colours) return;
  const root = document.documentElement.style;
  const c = t.colours;
  const map = { bg: c.bg, fg: c.header, dim: c.dim, accent: c.accent, border: c.border,
    running: c.running, thinking: c.thinking, done: c.done, asking: c.asking, interrupted: c.interrupted, idle: c.idle };
  for (const [k, v] of Object.entries(map)) if (v) root.setProperty('--' + k, v);
  root.colorScheme = t.light ? 'light' : 'dark';
  document.documentElement.classList.toggle('light', !!t.light);
  $('swatch').innerHTML = ['running', 'done', 'asking', 'interrupted', 'accent'].map((k) => `<i style="background:${c[k]}"></i>`).join('');
}

function renderThemePicker() {
  const sel = $('theme');
  const list = state.themes || [];
  if (sel.options.length !== list.length + 1) {
    sel.innerHTML = `<option value="">config · ${esc(state.theme.name)}</option>` +
      list.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}${t.light ? ' (light)' : ''}</option>`).join('');
  }
  sel.value = picked && list.some((t) => t.name === picked) ? picked : '';
}

const isLive = (a) => a.status === 'running' || a.status === 'thinking';
// mcp__plugin_x_chrome__use_browser -> chrome › use_browser
const tool = (n) => { const m = /^mcp__(.+?)__(.+)$/.exec(n || ''); return m ? `${m[1].replace(/^plugin_[^_]+_/, '')} › ${m[2]}` : (n || ''); };
// "2 agents" / "1 workflow" when the session's own turn is over but its children
// are still working — those sessions belong in the Working lane.
function background(r) {
  if (r.status === 'running' || r.status === 'thinking') return '';
  const wf = (r.workflows || []).filter((w) => w.state === 'running').length;
  const ag = (r.agents || []).filter(isLive).length;
  if (wf) return wf === 1 ? '1 workflow' : wf + ' workflows';
  return ag ? (ag === 1 ? '1 agent' : ag + ' agents') : '';
}
const more = (n) => (n > 0 ? `<li class="more">+${n} more</li>` : '');
function liveLi(a) {
  return `<li><span class="dot" style="--st:var(--${a.status});${phase(1400)}"></span>
    <span class="lbl">${esc(a.label || a.id)}</span>
    <span class="rt">${esc(tool(a.action) || (a.status === 'thinking' ? 'thinking' : ''))}${a.lastEventMs ? ' · ' + ago(a.lastEventMs) : ''}</span></li>`;
}

function card(r) {
  const plan = r.plan;
  const ratio = r.contextTokens && r.contextLimit ? r.contextTokens / r.contextLimit : 0;
  const live = r.status === 'running' || r.status === 'thinking';
  const doing = r.status === 'asking' ? (r.action === 'AskUserQuestion' ? 'Asked you a question' : 'Waiting for your approval' + (r.action ? `: <b>${esc(tool(r.action))}</b>` : ''))
    : live && (plan && plan.current) ? `<b>${esc(plan.current)}</b>${r.action ? ' · ' + esc(tool(r.action)) : ''}`
    : r.status === 'running' && r.action ? `Running <b>${esc(tool(r.action))}</b>`
    : r.queued ? `${r.queued} message${r.queued > 1 ? 's' : ''} queued` : '';

  // Collapsed, a card shows only what is moving: running workflows with their live
  // agents, live sub-agents, and a plan that is not finished. The rest is a click away.
  const wfs = (r.workflows || []).filter((w) => w.state === 'running').map((w) => {
    const pct = w.total ? Math.round(100 * w.done / w.total) : 0;
    const liveIn = (w.agents || []).filter(isLive);
    return `<div class="wf">
      <span class="ic">wf</span>
      <span class="nm">${esc(w.name || w.runId)}${w.phase ? `<small>${esc(w.phase)}</small>` : ''}</span>
      <span class="rt">${w.done}/${w.total}${w.cost ? ' · ' + money(w.cost) : ''}</span>
      <div class="bar wide"><i style="width:${pct}%;--c:var(--thinking)"></i></div>
      ${liveIn.length ? `<ul class="live">${liveIn.slice(0, 3).map((a) => liveLi(a)).join('')}${more(liveIn.length - 3)}</ul>` : ''}
    </div>`;
  }).join('');

  const planRow = plan && plan.total && plan.completed < plan.total ? `<div class="plan"><span class="num">${plan.completed}/${plan.total}</span>
      <div class="bar"><i style="width:${Math.round(100 * plan.completed / plan.total)}%;--c:var(--running)"></i></div>
      <span>tasks</span></div>` : '';

  const plain = r.agents || [];
  const livePlain = plain.filter(isLive);
  const agentsRow = livePlain.length ? `<ul class="live">${livePlain.slice(0, 3).map((a) => liveLi(a)).join('')}${more(livePlain.length - 3)}</ul>` : '';

  const work = wfs || planRow || agentsRow ? `<div class="work">${wfs}${agentsRow}${planRow}</div>` : '';
  const rc = r.recent || {};
  // What it said last matters most when it stopped: done, idle, waiting on you.
  // A session whose own turn ended while its agents work shows the agents instead.
  const said = rc.reply && !live && !background(r) ? `<p class="said ${r.status === 'asking' ? '' : 'one'}">${esc(rc.reply)}</p>` : '';

  return `<article class="card ${r.status} ${open.has(r.sessionId) ? 'open' : ''}" data-id="${esc(r.sessionId)}"
      style="--st:var(--${r.status});${r.focusColour ? `--focus-d:${r.focusColour};--focus-l:${r.focusColourLight}` : ''}">
    <button class="head" data-toggle="${esc(r.sessionId)}" aria-expanded="${open.has(r.sessionId)}">
      <div class="row1">
        <span class="pill"><span class="dot" style="${live || r.status === 'asking' ? phase(1400) : ''}"></span>${STATUS[r.status] || r.status}</span>
        ${background(r) ? `<span class="pill bg"><span class="dot" style="${phase(1400)}"></span>${background(r)} in background</span>` : ''}
        ${r.focus ? `<span class="focus"><i></i>${esc(r.focus.name)}</span>` : ''}
        <span class="age" data-ago="${r.lastEvent}">${ago(r.lastEvent)}</span>
      </div>
      <h3 class="title">${esc(r.title)}</h3>
      ${doing ? `<div class="doing">${doing}</div>` : ''}
      ${said}
      <div class="meta">
        <span>${esc(r.model || '?')}${r.effort ? ' · ' + esc(r.effort) : ''}</span>
        ${ratio ? `<span class="ctx" title="context window"><span class="bar"><i style="width:${Math.min(100, Math.round(ratio * 100))}%;--c:${ctxColour(ratio)}"></i></span>
          <span class="num">${tokens(r.contextTokens)}/${tokens(r.contextLimit)}</span></span>` : ''}
        <span class="cost" title="API-equivalent cost, sub-agents included">${money(r.cost)}</span>
      </div>
    </button>
    ${work}
    <div class="detail">${detail(r)}</div>
  </article>`;
}

function detail(r) {
  const parts = [];
  const rc = r.recent || {};
  if (rc.lastPrompt) parts.push(`<div><h4>Your last message</h4><div class="prompt">${esc(rc.lastPrompt)}</div></div>`);
  if (rc.activity && rc.activity.length) {
    parts.push(`<div><h4>Recent activity</h4><ul class="feed">${rc.activity.map((a) => `<li>
      <span class="t">${ago(a.at)}</span><span class="tool">${esc(a.name)}</span><span class="d" title="${esc(a.detail)}">${esc(a.detail)}</span></li>`).join('')}</ul></div>`);
  }
  const list = r.plan && r.plan.list;
  if (list && list.length) {
    const box = { completed: '✓', in_progress: '▸', pending: '○' };
    parts.push(`<div><h4>Tasks</h4><ul class="tasks">${list.map((t) => `<li class="${esc(t.status)}">
      <span class="box">${box[t.status] || '○'}</span><span>${esc(t.status === 'in_progress' && t.activeForm ? t.activeForm : t.subject)}
      ${t.status === 'pending' && t.blockedBy && t.blockedBy.length ? `<span class="blocked"> · after #${t.blockedBy.map(esc).join(', #')}</span>` : ''}</span></li>`).join('')}</ul></div>`);
  }
  for (const w of r.workflows || []) {
    if (!w.agents || !w.agents.length) continue;
    parts.push(`<div><h4>${esc(w.name)} · ${w.state === 'running' ? 'running for ' + dur(Date.now() - w.startedMs) : esc(w.state)}</h4>
      <ul class="agents">${w.agents.map((a) => agentLi(a, a.phase)).join('')}</ul></div>`);
  }
  if ((r.agents || []).length) {
    parts.push(`<div><h4>Sub-agents</h4><ul class="agents">${r.agents.map((a) => agentLi(a, a.model)).join('')}</ul></div>`);
  }
  parts.push(`<dl class="facts">
    ${rc.startedAt ? `<dt>started</dt><dd>${clock(rc.startedAt)} · ${dur(Date.now() - rc.startedAt)} ago</dd>` : ''}
    ${r.branch ? `<dt>branch</dt><dd>${esc(r.branch)}</dd>` : ''}
    ${r.permissionMode ? `<dt>mode</dt><dd>${esc(r.permissionMode)}</dd>` : ''}
    <dt>tokens</dt><dd>${tokens(r.tokens)}${r.agentsCost ? ` · sub-agents ${money(r.agentsCost)}` : ''}</dd>
    <dt>session</dt><dd><button class="copy" data-copy="${esc(r.sessionId)}" title="copy the full id">${esc(r.sessionId.slice(0, 8))}</button></dd>
  </dl>`);
  return parts.join('');
}

function agentLi(a, extra) {
  const live = a.status === 'running' || a.status === 'thinking';
  return `<li style="--st:var(--${a.status === 'done' ? 'done' : a.status})"><span class="dot" style="${live ? phase(1400) + ';animation:pulse 1.4s ease-in-out infinite' : ''}"></span>
    <span class="lbl">${esc(a.label || a.id)}</span>
    <span class="rt">${esc([a.action, extra].filter(Boolean).join(' · '))} ${ago(a.lastEventMs)}</span></li>`;
}

function renderBoard() {
  if (!state.rows) return;
  // Open tabs nobody touched for longer than the window (config "window") sit in
  // their own lane, so a forgotten tab is still findable.
  const quiet = (r) => state.quietAfterMs && !['asking', 'running', 'thinking'].includes(r.status) && !background(r)
    && Date.now() - r.lastEvent > state.quietAfterMs;
  const lane = (r) => (['asking', 'interrupted'].includes(r.status) ? 'you'
    : ['running', 'thinking'].includes(r.status) || background(r) ? 'work' : 'rest');
  const rows = state.rows.filter((r) => !quiet(r));
  const quietRows = state.rows.filter(quiet);
  $('board').innerHTML = LANES.map((l) => {
    const list = rows.filter((r) => lane(r) === l.key);
    if (!list.length && !l.none) return '';
    return `<div class="${laneClass(l.key)}">${laneHead(l.key, l.title, list.length)}
      ${list.length ? `<div class="cards">${list.map(card).join('')}</div>` : `<div class="empty">${l.none}</div>`}</div>`;
  }).join('') + quietLane(quietRows) + closedLane() + footer();
}

// Open tabs left alone for a while: one line each; click one for its full card.
function quietLane(list) {
  if (!list.length) return '';
  const expanded = list.filter((r) => open.has(r.sessionId));
  return `<div class="${laneClass('quiet')}">${laneHead('quiet', `Open, untouched for over ${dur(state.quietAfterMs)}`, list.length)}
    ${expanded.length ? `<div class="cards" style="margin-bottom:8px">${expanded.map(card).join('')}</div>` : ''}
    <div class="quiet">${list.filter((r) => !open.has(r.sessionId)).map((r) => `<div class="cl" data-toggle="${esc(r.sessionId)}"
        style="${r.focusColour ? `--focus-d:${r.focusColour};--focus-l:${r.focusColourLight}` : ''}">
      <span class="tt">${esc(r.title)}${r.focus ? `<small>${esc(r.focus.name)}</small>` : ''}</span>
      <span class="sub">${esc((r.recent && r.recent.reply) || '')}</span>
      <span class="act"><span class="when">${ago(r.lastEvent)}</span><span class="cost">${money(r.cost)}</span></span>
    </div>`).join('')}</div></div>`;
}

// Tabs that are gone. The copy button gives a line that reopens one in a terminal;
// in VS Code the Claude panel's session history opens the same conversation.
function closedLane() {
  const list = state.closed || [];
  if (!list.length) return '';
  const resume = (c) => (c.cwd ? `cd "${c.cwd}"; ` : '') + `claude --resume ${c.sessionId}`;
  return `<div class="${laneClass('closed')}">${laneHead('closed', 'Closed recently', list.length)}
    <p class="hint">Not open in any window, active in the last 3 days. Reopen one from the Claude panel's session history in VS Code, or paste the copied line into a terminal.</p>
    <div class="closed">${list.map((c) => `<div class="cl">
      <span class="tt">${esc(c.title)}${c.cwd ? `<small>${esc(c.cwd.split(/[\\/]/).pop())}</small>` : ''}</span>
      <span class="sub">${c.lastPrompt ? 'You: “' + esc(c.lastPrompt) + '”' : esc(c.reply)}</span>
      <span class="act"><span class="when" title="${new Date(c.lastEvent).toLocaleString()}">${ago(c.lastEvent)} ago</span>
        <button class="btn" data-copy="${esc(resume(c))}" title="${esc(resume(c))}">Copy resume</button></span>
    </div>`).join('')}</div></div>`;
}

function footer() {
  const hidden = [];
  if (state.hiddenEmpty) hidden.push(`${state.hiddenEmpty} empty tab${state.hiddenEmpty > 1 ? 's' : ''}`);
  if (state.hiddenStale) hidden.push(`${state.hiddenStale} older session${state.hiddenStale > 1 ? 's' : ''}`);
  return `<footer>${state.demo ? 'Demo data. ' : ''}${hidden.length ? 'Hidden: ' + hidden.join(', ') + ' (cmon --all shows them). ' : ''}The theme menu above changes this page only; <span class="num">node scripts/config.js set theme &lt;name&gt;</span> changes cmon everywhere.</footer>`;
}

function renderStats() {
  const rows = state.rows || [];
  const count = (...s) => rows.filter((r) => s.includes(r.status)).length;
  const waiting = count('asking', 'interrupted');
  const total = rows.reduce((s, r) => s + (r.cost || 0), 0);
  const wfLive = rows.reduce((s, r) => s + (r.workflows || []).filter((w) => w.state === 'running').length, 0);
  $('stats').innerHTML = [
    `<span class="stat ${waiting ? 'hot' : ''}"><span class="v">${waiting}</span><span class="k">waiting on you</span></span>`,
    `<span class="stat"><span class="v">${rows.filter((r) => ['running', 'thinking'].includes(r.status) || background(r)).length}</span><span class="k">working</span></span>`,
    wfLive ? `<span class="stat"><span class="v">${wfLive}</span><span class="k">workflow${wfLive > 1 ? 's' : ''} live</span></span>` : '',
    `<span class="stat" title="API-equivalent, open sessions, sub-agents included"><span class="v">${money(total)}</span><span class="k">open sessions</span></span>`,
  ].join('');
  document.title = waiting ? `(${waiting}) cmon` : 'cmon';
}

function renderFilters() {
  const counts = { all: 0 };
  for (const e of collapse(state.timeline || [])) { counts.all++; counts[e.type] = (counts[e.type] || 0) + 1; }
  const keys = ['all', 'session', 'workflow', 'task', 'agent'].filter((k) => k === 'all' || counts[k]);
  $('today-n').textContent = counts.all || '';
  $('filters').innerHTML = keys.map((k) => `<button class="chip ${filter === k ? 'sel' : ''}" data-filter="${k}">${k === 'all' ? 'All' : EV[k].label + 's'} ${counts[k] || 0}</button>`).join('');
}

function eventText(e) {
  const status = { done: 'finished', asking: 'is waiting on you', interrupted: 'stopped', idle: 'went quiet' };
  if (e.type === 'session') return { c: `var(--${e.status})`, what: `<b>${esc(e.title)}</b> ${status[e.status] || esc(e.status)}`,
    sub: [e.focus, e.turns > 1 ? `${e.turns} turns` : ''].filter(Boolean).join(' · ') };
  if (e.type === 'workflow') return { c: e.status === 'done' ? 'var(--done)' : 'var(--interrupted)',
    what: `Workflow <b>${esc(e.name)}</b> ${e.status === 'done' ? 'finished' : 'stopped'}`,
    sub: [e.total ? e.total + ' agents' : '', e.durationMs ? dur(e.durationMs) : '', e.cost ? money(e.cost) : '', e.title].filter(Boolean).join(' · ') };
  if (e.type === 'task') return { c: 'var(--running)', what: `<b>${esc(e.name)}</b>`, sub: e.title };
  return { c: 'var(--thinking)', what: `Sub-agent <b>${esc(e.name)}</b> ${e.status === 'done' ? 'finished' : esc(e.status)}`, sub: e.title };
}

// A chat ends a turn every few minutes; one line per session per half hour is
// enough. The newest turn keeps its place and counts the ones folded into it.
function collapse(events) {
  const out = [];
  const last = new Map();
  for (const e of events) {
    const prev = e.type === 'session' && last.get(e.sessionId);
    if (prev && prev.status === e.status && e.at - prev.at < 30 * 60000) {
      prev.at = e.at; prev.turns = (prev.turns || 1) + 1;
      continue;
    }
    const copy = { ...e };
    out.push(copy);
    if (e.type === 'session') last.set(e.sessionId, copy);
  }
  return out.sort((a, b) => a.at - b.at);
}

function renderTimeline() {
  const list = collapse(state.timeline || []).filter((e) => filter === 'all' || e.type === filter).reverse();
  if (!list.length) {
    $('timeline').innerHTML = `<div class="empty" style="margin-top:8px">Nothing has finished yet today. Sessions, workflows, tasks and sub-agents appear here as they finish.</div>`;
    return;
  }
  let hour = '';
  const out = [];
  for (const e of list) {
    const h = new Date(e.at).toLocaleTimeString([], { hour: '2-digit' }) + ':00';
    if (h !== hour) { hour = h; out.push(`<div class="hour">${h}</div>`); }
    const key = `${e.at}|${e.type}|${e.sessionId}|${e.name || ''}`;
    const fresh = seenEvents.size && !seenEvents.has(key);
    seenEvents.add(key);
    const t = eventText(e);
    out.push(`<div class="ev ${fresh ? 'fresh' : ''}" style="--c:${t.c}"><span class="g">${EV[e.type] ? EV[e.type].g : '·'}</span>
      <span class="what">${t.what}${t.sub ? `<span class="sub">${esc(t.sub)}</span>` : ''}</span>
      <span class="when" title="${clock(e.at)}">${clock(e.at)}</span></div>`);
  }
  $('timeline').innerHTML = out.join('');
}

function render() {
  if (!state || !state.rows) return;
  applyTheme(currentTheme());
  renderThemePicker();
  renderStats();
  renderBoard();
  renderFilters();
  renderTimeline();
}

// A hidden tab keeps only the latest snapshot and draws nothing.
function receive(next) {
  if (document.hidden && state && state.rows) { pending = next; return; }
  state = next;
  render();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && pending) { state = pending; pending = null; render(); }
});

document.addEventListener('click', (ev) => {
  const copy = ev.target.closest('[data-copy]');
  if (copy) {
    ev.stopPropagation();
    const text = copy.dataset.copy;
    const done = () => { copy.textContent = 'Copied'; setTimeout(() => render(), 1200); };
    // Simple Browser can refuse the async clipboard; the old textarea route still works there.
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { copy.textContent = 'copy failed'; }
      ta.remove();
    };
    navigator.clipboard ? navigator.clipboard.writeText(text).then(done, fallback) : fallback();
    return;
  }
  const fold = ev.target.closest('[data-fold]');
  if (fold) {
    const key = fold.dataset.fold;
    folded.has(key) ? folded.delete(key) : folded.add(key);
    store.set('cmon.folded', [...folded].join(','));
    key === 'today' ? applyTodayFold() : renderBoard();
    return;
  }
  const f = ev.target.closest('[data-filter]');
  if (f) { filter = f.dataset.filter; renderFilters(); renderTimeline(); return; }
  const t = ev.target.closest('[data-toggle]');
  if (t) {
    const id = t.dataset.toggle;
    open.has(id) ? open.delete(id) : open.add(id);
    try { sessionStorage.setItem('cmon.open', JSON.stringify([...open])); } catch (e) { /* private mode */ }
    // Re-render rather than toggle a class: a quiet row turns into a card and back.
    render();
  }
});

$('theme').addEventListener('change', (ev) => {
  picked = ev.target.value;
  store.set('cmon.theme', picked);
  render();
});

// Ages and the clock tick locally; the data only moves when cmon sends it.
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (document.hidden) return;
  for (const el of document.querySelectorAll('[data-ago]')) el.textContent = ago(Number(el.dataset.ago));
}, 15000);
$('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function connect() {
  const es = new EventSource('/events');
  es.onmessage = (m) => { $('conn').className = 'conn'; $('conn').lastChild.textContent = 'live'; receive(JSON.parse(m.data)); };
  es.onerror = () => { $('conn').className = 'conn off'; $('conn').lastChild.textContent = 'reconnecting'; };
}
connect();
</script>
</body>
</html>
